<style>

<body>
<div class="wrap" id="app">
  <div class="top">
    <div>
      <h1>THE SPREAD</h1>
      <div class="tag">Weekly picks against the line. Best bet pays double. <a href="#" id="rulesLink">Rules</a></div>
    </div>
    <div class="toggle" id="viewToggle"></div>
  </div>
  <div id="content"><div class="empty">Loading…</div></div>
  <footer>Picks lock when a week is marked locked, or automatically at the deadline shown above.</footer>
</div>

<script>
const $ = (sel, el=document) => el.querySelector(sel);
const esc = (s) => (s==null? '' : String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtSpread = (n) => n===0 ? 'PICK' : (n>0? '+'+n : String(n));
const teamLabel = (name, logo, small) => `${logo ? `<img class="team-logo${small?' small':''}" src="${esc(logo)}" alt="" loading="lazy">` : ''}<span>${esc(name)}</span>`;

let db=null;
let uid=null, myName=null, canEdit=false;
let profileCache = {};

let state = { weeks:{}, games:{}, picks:{}, currentWeekId:null, loaded:{weeks:false, games:false, picks:false, current:false} };
let draft = { weekId:null, selections:{}, bestBet:null };
let draftHydrated = false;
let view = 'play'; // 'play' | 'history' | 'admin'
let expandedWeeks = new Set();
let adminSelectedWeek = null;
let saving = false;
let saveMsg = '';

function render(){
  renderToggle();
  if(view==='admin' && canEdit){
    $('#content').innerHTML = renderAdmin();
    wireAdmin();
  } else if(view==='history'){
    $('#content').innerHTML = renderHistory();
    wireHistory();
  } else {
    $('#content').innerHTML = renderPlay();
    wirePlay();
  }
}

function renderToggle(){
  const t = $('#viewToggle');
  let html = `
    <button class="pill ${view==='play'?'active':''}" data-view="play">Play</button>
    <button class="pill ${view==='history'?'active':''}" data-view="history">History</button>
  `;
  if(canEdit){
    html += `<button class="pill ${view==='admin'?'active':''}" data-view="admin">Admin</button>`;
  } else {
    html += `<button class="pill" id="unlockAdmin">Commissioner</button>`;
  }
  t.innerHTML = html;
  t.querySelectorAll('button[data-view]').forEach(b=> b.onclick = ()=>{ view=b.dataset.view; render(); });
  const unlockBtn = $('#unlockAdmin', t);
  if(unlockBtn) unlockBtn.onclick = () => {
    const pin = prompt('Commissioner PIN:');
    if(pin===null) return;
    if(pin===ADMIN_PIN){
      canEdit = true; localStorage.setItem('spread_is_admin','yes'); view='admin'; render();
    } else {
      alert('Wrong PIN.');
    }
  };
}

// ---------- derived helpers ----------
function weekIsLocked(week){
  if(!week) return false;
  if(week.locked) return true;
  if(week.deadline && Date.now() >= new Date(week.deadline).getTime()) return true;
  return false;
}
function gameIsLocked(g){
  return !!(g.kickoff && Date.now() >= new Date(g.kickoff).getTime());
}
function gamesForWeek(weekId){
  return Object.entries(state.games)
    .filter(([id,g]) => g.weekId===weekId)
    .sort((a,b)=> (a[1].order??0)-(b[1].order??0))
    .map(([id,g]) => ({id, ...g}));
}
function scoreForUser(uidKey){
  const doc = state.picks[uidKey];
  let pts=0, correct=0, total=0, bestHits=0;
  if(!doc || !doc.weeks) return {pts,correct,total,bestHits};
  Object.entries(doc.weeks).forEach(([weekId, wk]) => {
    const games = gamesForWeek(weekId);
    games.forEach(g => {
      if(!g.final || !g.atsResult || g.atsResult==='push') return;
      const pick = wk.selections && wk.selections[g.id];
      if(!pick) return;
      total++;
      const isBest = wk.bestBet === g.id;
      if(pick === g.atsResult){
        correct++;
        pts += isBest ? 2 : 1;
        if(isBest) bestHits++;
      }
    });
  });
  return {pts, correct, total, bestHits};
}
// Consecutive most-recent weeks (walking backward) where the user's best
// bet hit. Weeks with no best bet, or whose best-bet game isn't graded
// yet, are skipped rather than breaking the streak; a graded miss ends it.
function bestBetStreak(uidKey){
  const doc = state.picks[uidKey];
  if(!doc || !doc.weeks) return 0;
  const orderedWeekIds = Object.keys(state.weeks)
    .sort((a,b)=> new Date(state.weeks[a].createdAt||0) - new Date(state.weeks[b].createdAt||0));
  let streak = 0;
  for(let i=orderedWeekIds.length-1; i>=0; i--){
    const wid = orderedWeekIds[i];
    const wk = doc.weeks[wid];
    if(!wk || !wk.bestBet) continue;
    const games = gamesForWeek(wid);
    const bestGame = games.find(g => g.id===wk.bestBet);
    if(!bestGame || !bestGame.final || !bestGame.atsResult || bestGame.atsResult==='push') continue;
    const pick = wk.selections && wk.selections[wk.bestBet];
    if(pick === bestGame.atsResult){ streak++; }
    else { break; }
  }
  return streak;
}
function ensureProfiles(ids){ /* no-op: profiles collection is subscribed live in boot() */ }
function nameFor(id){
  if(id===uid) return (profileCache[id]?.name || myName || 'You');
  return profileCache[id]?.name || 'Someone';
}
function showRulesModal(){
  const overlay = document.createElement('div');
  overlay.style.cssText='position:fixed;inset:0;background:rgba(10,14,11,0.6);display:flex;align-items:center;justify-content:center;z-index:999;padding:20px;';
  overlay.innerHTML = `
    <div style="background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:24px;max-width:400px;width:100%;font-family:'Karla',sans-serif;max-height:85vh;overflow-y:auto;">
      <h2 style="margin:0 0 12px;font-family:'Big Shoulders Display',sans-serif;font-size:26px;color:var(--ink);">How this works</h2>
      <div style="font-size:14px;color:var(--ink);line-height:1.6;">
        <p style="margin:0 0 10px;"><strong>Pick a side.</strong> For each game, pick the team you think covers the spread — the favorite has to win by more than the number, the underdog just has to not lose by more than it. Landing exactly on the number is a push and scores 0 either way, for everyone.</p>
        <p style="margin:0 0 10px;"><strong>One best bet.</strong> Tap the ★ on exactly one game each week. It's worth double if it hits — same as a normal pick if it doesn't.</p>
        <p style="margin:0 0 6px;"><strong>Scoring</strong></p>
        <ul style="margin:0 0 10px; padding-left:20px;">
          <li>Correct pick — 1 point</li>
          <li>Correct best bet — 2 points</li>
          <li>Wrong pick, or a push — 0 points</li>
        </ul>
        <p style="margin:0 0 10px;"><strong>Locks.</strong> Each game locks the moment it kicks off. Games later in the week stay pickable even after earlier ones have started.</p>
        <p style="margin:0;"><strong>Ties</strong> in the season standings are broken by best-bet hits, then overall pick accuracy.</p>
      </div>
      <button id="closeRules" class="primary" style="width:100%;margin-top:16px;">Got it</button>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#closeRules').onclick = () => overlay.remove();
  overlay.addEventListener('click', (e) => { if(e.target===overlay) overlay.remove(); });
}
function showNameModal(onSubmit){
  const overlay = document.createElement('div');
  overlay.style.cssText='position:fixed;inset:0;background:rgba(10,14,11,0.6);display:flex;align-items:center;justify-content:center;z-index:999;padding:20px;';
  overlay.innerHTML = `
    <div style="background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:24px;max-width:340px;width:100%;font-family:'Karla',sans-serif;">
      <h2 style="margin:0 0 6px;font-family:'Big Shoulders Display',sans-serif;font-size:26px;color:var(--ink);">Who's picking?</h2>
      <p style="margin:0 0 14px;font-size:13px;color:var(--muted);">This is the name your friends will see on the standings.</p>
      <input id="nameInput" type="text" placeholder="Your name" style="width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:var(--panel-2);color:var(--ink);font-family:inherit;font-size:14px;margin-bottom:12px;">
      <button id="nameSubmit" class="primary" style="width:100%;">Let's go</button>
    </div>`;
  document.body.appendChild(overlay);
  const input = overlay.querySelector('#nameInput');
  const submit = () => {
    const val = input.value.trim();
    if(!val) return;
    overlay.remove();
    onSubmit(val);
  };
  overlay.querySelector('#nameSubmit').onclick = submit;
  input.addEventListener('keydown', e => { if(e.key==='Enter') submit(); });
  input.focus();
}
async function ensureName(){
  const snap = await db.collection('profiles').doc(uid).get();
  if(snap.exists && snap.data().name){ myName = snap.data().name; return; }
  await new Promise(resolve => {
    showNameModal(async (name) => {
      await db.collection('profiles').doc(uid).set({name});
      myName = name;
      resolve();
    });
  });
}

// ---------- PLAY VIEW ----------
function renderPlay(){
  const weekId = state.currentWeekId;
  const week = weekId ? state.weeks[weekId] : null;
  let html = '';

  if(!week){
    html += `<div class="empty">No week is live yet. Check back once the commissioner sets one up.</div>`;
    html += renderLeaderboard();
    return html;
  }

  const locked = weekIsLocked(week);
  if(draft.weekId !== weekId){
    draft = { weekId, selections: {}, bestBet: null };
    draftHydrated = false;
  }
  if(!draftHydrated && state.loaded.picks){
    const mine = state.picks[uid]?.weeks?.[weekId];
    draft.selections = {...(mine?.selections||{})};
    draft.bestBet = mine?.bestBet || null;
    draftHydrated = true;
  }
  const games = gamesForWeek(weekId);
  const mySaved = state.picks[uid]?.weeks?.[weekId];

  let countdownHtml = '';
  if(week.deadline){
    const ms = new Date(week.deadline).getTime() - Date.now();
    if(locked){
      countdownHtml = `<div class="countdown locked">Picks locked</div>`;
    } else {
      const hrs = ms/3600000;
      const cls = hrs < 3 ? 'urgent' : '';
      countdownHtml = `<div class="countdown ${cls}">Locks ${new Date(week.deadline).toLocaleString([], {weekday:'short', month:'short', day:'numeric', hour:'numeric', minute:'2-digit'})}</div>`;
    }
  } else if(locked){
    countdownHtml = `<div class="countdown locked">Picks locked</div>`;
  }

  html += `<div class="week-header"><h2>${esc(week.label||'This week')}</h2>${countdownHtml}</div>`;

  if(!locked){
    const unpicked = games.filter(g => !gameIsLocked(g) && !draft.selections[g.id] && g.kickoff);
    let soonestMs = null;
    unpicked.forEach(g => {
      const ms = new Date(g.kickoff).getTime() - Date.now();
      if(soonestMs===null || ms < soonestMs) soonestMs = ms;
    });
    if(unpicked.length>0 && soonestMs!==null && soonestMs < 6*3600000){
      const hrs = soonestMs/3600000;
      const timeTxt = hrs < 1 ? Math.max(1, Math.round(soonestMs/60000))+' min' : Math.round(hrs)+' hr'+(Math.round(hrs)===1?'':'s');
      html += `<div class="banner urgent"><strong>${unpicked.length} game${unpicked.length===1?'':'s'} not picked yet</strong> — locks in about ${timeTxt}.</div>`;
    }
  }

  if(games.length===0){
    html += `<div class="panel"><div class="empty">No games added for this week yet.</div></div>`;
  } else {
    html += `<div class="panel">`;
    ensureProfiles(Object.keys(state.picks));
    let anyOpen = false;
    games.forEach(g => {
      const gLocked = locked || gameIsLocked(g);
      if(!gLocked) anyOpen = true;
      const favFav = g.favorite==='home' ? g.home : (g.favorite==='away' ? g.away : null);
      const awayLine = g.favorite==='away' ? fmtSpread(-Math.abs(g.spread)) : (g.favorite==='home' ? fmtSpread(Math.abs(g.spread)) : 'PICK');
      const homeLine = g.favorite==='home' ? fmtSpread(-Math.abs(g.spread)) : (g.favorite==='away' ? fmtSpread(Math.abs(g.spread)) : 'PICK');
      const mySel = draft.selections[g.id];
      const isBest = draft.bestBet === g.id;
      const resultTag = g.final && g.atsResult ? `<span class="result-tag">${g.atsResult==='push'?'PUSH':(g.atsResult==='home'?esc(g.home)+' covered':esc(g.away)+' covered')}</span>` : '';
      const kickLabel = g.kickoff ? new Date(g.kickoff).toLocaleString([], {weekday:'short', hour:'numeric', minute:'2-digit'}) : '';

      html += `<div class="game" data-game="${g.id}">
        <div class="matchup">
          <div class="teams">${teamLabel(g.away, g.awayLogo, true)}<span class="at">@</span>${teamLabel(g.home, g.homeLogo, true)}${resultTag}</div>
          ${kickLabel ? `<div class="kick">${gLocked && !locked ? 'Locked · ':''}${esc(kickLabel)}</div>` : (gLocked ? `<div class="kick">Locked</div>` : '')}
        </div>
        <div class="picks-row">
          <button class="side ${mySel==='away'?'selected':''}" data-side="away" ${gLocked?'disabled':''}>
            <span class="team">${teamLabel(g.away, g.awayLogo)}</span><span class="line">${awayLine}</span>
          </button>
          <button class="side ${mySel==='home'?'selected':''}" data-side="home" ${gLocked?'disabled':''}>
            <span class="team">${teamLabel(g.home, g.homeLogo)}</span><span class="line">${homeLine}</span>
          </button>
          <button class="star ${isBest?'selected':''}" data-star="1" title="Best bet — double points" ${gLocked?'disabled':''}>★</button>
        </div>
        ${gLocked ? renderReveal(g) : ''}
      </div>`;
    });
    html += `</div>`;

    if(anyOpen){
      const savedTxt = mySaved ? 'Saved. Edit any open game until it kicks off.' : 'Not submitted yet.';
      html += `<div class="panel"><div class="submitbar">
        <div class="status">${saveMsg || savedTxt}</div>
        <div style="display:flex; gap:8px; align-items:center;">
          ${mySaved ? `<button class="ghost danger" id="clearMyPicks">Clear my picks</button>` : ''}
          <button class="primary" id="submitPicks" ${saving?'disabled':''}>${saving?'Saving…':'Save picks'}</button>
        </div>
      </div></div>`;
    } else {
      html += renderSubmittedPips(weekId);
    }
  }

  html += renderLeaderboard();
  return html;
}

function renderReveal(g){
  const rows = Object.entries(state.picks)
    .filter(([pid, doc]) => doc.weeks && doc.weeks[g.weekId] && doc.weeks[g.weekId].selections && doc.weeks[g.weekId].selections[g.id])
    .map(([pid, doc]) => {
      const wk = doc.weeks[g.weekId];
      const pick = wk.selections[g.id];
      const isBest = wk.bestBet === g.id;
      const team = pick==='home' ? g.home : g.away;
      let cls = '';
      if(g.final && g.atsResult && g.atsResult!=='push'){
        cls = pick===g.atsResult ? 'hit' : 'miss';
      }
      return {pid, label: `${team}${isBest? ' ★':''}`, cls};
    });
  if(rows.length===0) return `<div class="reveal">No picks submitted.</div>`;
  ensureProfiles(rows.map(r=>r.pid));
  return `<div class="reveal">${rows.map(r=> `<div class="rowline"><span>${esc(nameFor(r.pid))}</span><span class="${r.cls}">${esc(r.label)}</span></div>`).join('')}</div>`;
}

function renderSubmittedPips(weekId){
  const ids = Object.keys(state.picks);
  if(ids.length===0) return '';
  ensureProfiles(ids);
  return `<div class="panel"><div class="pips">${ids.map(id => {
    const done = !!(state.picks[id].weeks && state.picks[id].weeks[weekId]);
    return `<span class="pip ${done?'done':''}">${esc(nameFor(id))}</span>`;
  }).join('')}</div></div>`;
}

function renderLeaderboard(){
  const ids = Object.keys(state.picks);
  ensureProfiles(ids);
  const rows = ids.map(id => ({id, ...scoreForUser(id), streak: bestBetStreak(id)}))
    .sort((a,b) =>
      b.pts - a.pts ||
      b.bestHits - a.bestHits ||
      (b.total? b.correct/b.total : 0) - (a.total? a.correct/a.total : 0) ||
      nameFor(a.id).localeCompare(nameFor(b.id))
    );
  let html = `<h3 class="section">Standings</h3><div class="panel">`;
  if(rows.length===0){
    html += `<div class="empty">No picks submitted yet — standings will appear once someone plays.</div>`;
  } else {
    html += `<table class="board"><thead><tr><th></th><th>Player</th><th style="text-align:right">Record</th><th style="text-align:right">Pts</th></tr></thead><tbody>`;
    rows.forEach((r,i) => {
      html += `<tr>
        <td class="rank">${i+1}</td>
        <td class="name">${esc(nameFor(r.id))}${r.id===uid?'<span class="you-tag">You</span>':''}${r.streak>=2?`<span class="streak-badge">🔥${r.streak}</span>`:''}</td>
        <td style="text-align:right" class="muted">${r.correct}-${r.total-r.correct}${r.bestHits? ' · '+r.bestHits+'★':''}</td>
        <td class="pts">${r.pts}</td>
      </tr>`;
    });
    html += `</tbody></table>`;
  }
  html += `</div>`;
  return html;
}

function wirePlay(){
  const weekId = state.currentWeekId;
  const week = weekId ? state.weeks[weekId] : null;
  if(!week || weekIsLocked(week)) return;
  $('#content').querySelectorAll('.game').forEach(gameEl => {
    const gid = gameEl.dataset.game;
    gameEl.querySelectorAll('button.side').forEach(btn => {
      btn.onclick = () => {
        draft.selections[gid] = btn.dataset.side;
        if(uid) render();
      };
    });
    const star = gameEl.querySelector('button.star');
    if(star) star.onclick = () => {
      draft.bestBet = (draft.bestBet===gid) ? null : gid;
      render();
    };
  });
  const submitBtn = $('#submitPicks');
  if(submitBtn) submitBtn.onclick = savePicks;
  const clearBtn = $('#clearMyPicks');
  if(clearBtn) clearBtn.onclick = clearMyPicks;
}

async function savePicks(){
  if(!uid || saving) return;
  saving = true; saveMsg=''; render();
  try{
    const existing = state.picks[uid] || {};
    const weeks = {...(existing.weeks||{})};
    weeks[draft.weekId] = { selections: {...draft.selections}, bestBet: draft.bestBet, updatedAt: new Date().toISOString() };
    await db.collection('picks').doc(uid).set({ ...existing, weeks });
    saveMsg = 'Saved ✓';
  } catch(e){
    saveMsg = 'Could not save — try again.';
  }
  saving = false; render();
  setTimeout(()=>{ saveMsg=''; render(); }, 3000);
}

async function clearMyPicks(){
  if(!uid || saving) return;
  if(!confirm('Clear your picks for this week? This only affects you.')) return;
  saving = true; render();
  try{
    const existing = state.picks[uid] || {};
    const weeks = {...(existing.weeks||{})};
    delete weeks[draft.weekId];
    await db.collection('picks').doc(uid).set({ ...existing, weeks });
    draft = { weekId: draft.weekId, selections: {}, bestBet: null };
    saveMsg = 'Cleared.';
  } catch(e){
    saveMsg = 'Could not clear — try again.';
  }
  saving = false; render();
  setTimeout(()=>{ saveMsg=''; render(); }, 3000);
}

// ---------- HISTORY VIEW ----------
function renderHistory(){
  const pastWeekIds = Object.keys(state.weeks)
    .filter(id => id !== state.currentWeekId)
    .sort((a,b) => new Date(state.weeks[b].createdAt||0) - new Date(state.weeks[a].createdAt||0));

  let html = `<h3 class="section">Season history</h3>`;
  if(pastWeekIds.length===0){
    html += `<div class="panel"><div class="empty">No past weeks yet — this is where finished weeks will show up for browsing (and roasting).</div></div>`;
    return html;
  }
  html += `<div class="panel">`;
  pastWeekIds.forEach(wid => {
    const w = state.weeks[wid];
    const games = gamesForWeek(wid);
    const gradedCount = games.filter(g=>g.final && g.atsResult).length;
    const isOpen = expandedWeeks.has(wid);
    html += `<div class="history-week">
      <div class="history-week-head" data-toggle="${wid}">
        <div><strong>${esc(w.label||wid)}</strong> <span class="muted">${games.length} game${games.length===1?'':'s'}${gradedCount? ' · '+gradedCount+' graded':''}</span></div>
        <span class="chev">${isOpen?'▲':'▼'}</span>
      </div>`;
    if(isOpen){
      html += `<div class="history-body">`;
      if(games.length===0){
        html += `<div class="empty">No games were added for this week.</div>`;
      } else {
        games.forEach(g => {
          const resultTag = g.final && g.atsResult ? `<span class="result-tag">${g.atsResult==='push'?'PUSH':(g.atsResult==='home'?esc(g.home)+' covered':esc(g.away)+' covered')}</span>` : '<span class="result-tag" style="color:var(--muted)">UNGRADED</span>';
          html += `<div class="game">
            <div class="matchup"><div class="teams">${teamLabel(g.away, g.awayLogo, true)}<span class="at">@</span>${teamLabel(g.home, g.homeLogo, true)}${resultTag}</div></div>
            ${renderReveal(g)}
          </div>`;
        });
      }
      html += `</div>`;
    }
    html += `</div>`;
  });
  html += `</div>`;
  return html;
}

function wireHistory(){

      const wid = el.dataset.toggle;
      if(expandedWeeks.has(wid)) expandedWeeks.delete(wid); else expandedWeeks.add(wid);

function wireAdmin(){
  $('#content').querySelectorAll('[data-setcurrent]').forEach(b => b.onclick = () => db.doc('meta/current').set({weekId:b.dataset.setcurrent}));
  $('#content').querySelectorAll('[data-togglelock]').forEach(b => b.onclick = () => {
    const id = b.dataset.togglelock;
    db.doc('weeks/'+id).update({locked: !state.weeks[id].locked});
  });
  $('#content').querySelectorAll('[data-managegames]').forEach(b => b.onclick = () => { adminSelectedWeek = b.dataset.managegames; render(); });
  $('#content').querySelectorAll('[data-deleteweek]').forEach(b => b.onclick = () => {
    if(!confirm('Delete this week and its games?')) return;
    const id = b.dataset.deleteweek;
    gamesForWeek(id).forEach(g => db.doc('games/'+g.id).delete());
    db.doc('weeks/'+id).delete();
    if(adminSelectedWeek===id) adminSelectedWeek=null;
  });
  $('#content').querySelectorAll('[data-deletegame]').forEach(b => b.onclick = () => db.doc('games/'+b.dataset.deletegame).delete());
  $('#content').querySelectorAll('[data-result]').forEach(sel => sel.onchange = () => {
    const gid = sel.dataset.result;
    const val = sel.value;
    if(val===''){ db.doc('games/'+gid).update({atsResult:null, final:false}); }
    else { db.doc('games/'+gid).update({atsResult:val, final:true}); }
  });
  const addWeekBtn = $('#addWeekBtn');
  if(addWeekBtn) addWeekBtn.onclick = async () => {
    const label = $('#newWeekLabel').value.trim() || 'Untitled week';
    const dlRaw = $('#newWeekDeadline').value;
    const deadline = dlRaw ? new Date(dlRaw).toISOString() : null;
    const ref = await db.collection('weeks').add({label, deadline, locked:false, createdAt:new Date().toISOString()});
    adminSelectedWeek = ref.id;
    if(!state.currentWeekId) db.doc('meta/current').set({weekId: ref.id});
  };
  const addGameBtn = $('#addGameBtn');
  if(addGameBtn) addGameBtn.onclick = async () => {
    const away = $('#gAway').value.trim(), home = $('#gHome').value.trim();
    if(!away || !home) return;
    const fav = $('#gFav').value || null;
    const spread = Math.abs(parseFloat($('#gSpread').value)) || 0;
    const kickRaw = $('#gKick').value;
    const kickoff = kickRaw ? new Date(kickRaw).toISOString() : null;
    const order = gamesForWeek(adminSelectedWeek).length;
    await db.collection('games').add({weekId: adminSelectedWeek, order, away, home, favorite:fav, spread, kickoff, atsResult:null, final:false});
    $('#gAway').value=''; $('#gHome').value=''; $('#gSpread').value=''; $('#gKick').value='';
  };

  const clearAllPicksBtn = $('#clearAllPicksBtn');
  if(clearAllPicksBtn) clearAllPicksBtn.onclick = async () => {
    if(!confirm(`Delete every player's picks across every week? Weeks and games stay put. This cannot be undone.`)) return;
    const snap = await db.collection('picks').get();
    await Promise.all(snap.docs.map(d => d.ref.delete()));
    alert('All picks cleared.');
  };
  const resetEverythingBtn = $('#resetEverythingBtn');
  if(resetEverythingBtn) resetEverythingBtn.onclick = async () => {
    if(!confirm('This deletes ALL weeks, games, and picks — a full reset back to nothing. Are you sure?')) return;
    if(!confirm('Really sure? There is no undo.')) return;
    const [weeksSnap, gamesSnap, picksSnap] = await Promise.all([
      db.collection('weeks').get(),
      db.collection('games').get(),
      db.collection('picks').get(),
    ]);
    await Promise.all([
      ...weeksSnap.docs.map(d => d.ref.delete()),
      ...gamesSnap.docs.map(d => d.ref.delete()),
      ...picksSnap.docs.map(d => d.ref.delete()),
      db.doc('meta/current').delete(),
    ]);
    adminSelectedWeek = null;
    alert('Everything reset.');
  };
}

let appStarted = false;
let unsubscribers = [];
let renderIntervalId = null;

function stopApp(){
  unsubscribers.forEach(u => u());
  unsubscribers = [];
  if(renderIntervalId){ clearInterval(renderIntervalId); renderIntervalId = null; }
  appStarted = false;
}

function startApp(){
  if(appStarted) return;
  appStarted = true;

  unsubscribers.push(db.collection('profiles').onSnapshot(qs => {
    const m = {}; qs.docs.forEach(d => m[d.id]=d.data());
    profileCache = m; render();
  }));

  unsubscribers.push(db.doc('meta/current').onSnapshot(snap => {
    state.currentWeekId = snap.exists ? (snap.data().weekId||null) : null;
    state.loaded.current = true;
    render();
  }, ()=>{ state.loaded.current = true; render(); }));

  unsubscribers.push(db.collection('weeks').onSnapshot(qs => {
    const m = {}; qs.docs.forEach(d => m[d.id]=d.data());
    state.weeks = m; state.loaded.weeks = true; render();
  }, ()=>{ state.loaded.weeks = true; render(); }));

  unsubscribers.push(db.collection('games').onSnapshot(qs => {
    const m = {}; qs.docs.forEach(d => m[d.id]=d.data());
    state.games = m; state.loaded.games = true; render();
  }, ()=>{ state.loaded.games = true; render(); }));

  unsubscribers.push(db.collection('picks').onSnapshot(qs => {
    const m = {}; qs.docs.forEach(d => m[d.id]=d.data());
    state.picks = m; state.loaded.picks = true; render();
  }, ()=>{ state.loaded.picks = true; render(); }));

  render();
  renderIntervalId = setInterval(render, 30000);

  const switchLink = document.createElement('div');
  switchLink.style.cssText='text-align:center;margin-top:6px;';
  switchLink.innerHTML = `<a href="#" id="switchPlayer" style="font-size:12px;color:var(--muted);text-decoration:underline;">Signed in as ${esc(myName)} · Sign out</a>`;
  document.querySelector('footer').after(switchLink);
  switchLink.querySelector('#switchPlayer').onclick = async (e) => {
    e.preventDefault();
    stopApp();
    switchLink.remove();
    await firebase.auth().signOut();
  };
}

// ---------- boot ----------
async function boot(){
  if(!FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey==='YOUR_API_KEY'){
    $('#content').innerHTML = `<div class="banner">This page needs a Firebase project connected before it'll work — paste your config into the FIREBASE_CONFIG block near the top of this file.</div>`;
    return;
  }
  firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.firestore();
  const auth = firebase.auth();

  // Finish an email-link sign-in if this load is that link being opened.
  if(auth.isSignInWithEmailLink(window.location.href)){
    let email = localStorage.getItem('spread_pending_email');
    if(!email){ email = window.prompt('Confirm the email you signed in with:'); }
    if(email){
      try{
        await auth.signInWithEmailLink(email, window.location.href);
        localStorage.removeItem('spread_pending_email');
      } catch(e){
        alert('That sign-in link didn\'t work: ' + e.message);
      }
    }
    window.history.replaceState({}, document.title, window.location.pathname);
  }

  // Surface any error from a Google redirect that just completed.
  try{ await auth.getRedirectResult(); } catch(e){ console.error(e); }

  auth.onAuthStateChanged(async (user) => {
    if(!user){
      stopApp();
      renderSignInScreen();
      return;
    }
    uid = user.uid;
    canEdit = localStorage.getItem('spread_is_admin')==='yes';

    if(user.displayName){
      const snap = await db.collection('profiles').doc(uid).get();
      if(snap.exists && snap.data().name){
        myName = snap.data().name;
      } else {
        myName = user.displayName;
        await db.collection('profiles').doc(uid).set({ name: myName });
      }
    } else {
      await ensureName();
    }

    startApp();
  });
}
document.getElementById('rulesLink').addEventListener('click', (e) => { e.preventDefault(); showRulesModal(); });
boot();
</script>
</body>
