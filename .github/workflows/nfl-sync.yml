name: NFL weekly sync

on:
  schedule:
    # Every Tuesday at 13:00 UTC (~9am ET / 6am PT) — after Monday Night
    # Football wraps and sportsbooks have posted the new week's lines.
    - cron: '0 13 * * 2'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node scripts/sync-nfl.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
