name: NFL weekly sync

on:
  schedule:
    # Every Wednesday at 13:00 UTC (~9am ET / 6am PT). ESPN's own
    # "current week" pointer doesn't roll over until Wednesday, so running
    # on Tuesday just re-confirmed the week that had already finished.
    - cron: '0 13 * * 3'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node scripts/sync-nfl.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
